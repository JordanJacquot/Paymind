# Construction d'une version de Paymind sur GitHub, depuis le dépôt (jamais depuis un PC), puis signature Authenticode
# gratuite par SignPath Foundation (même modèle que Mindset, Nevermind et Mindcare). Paymind est seulement en Rust.
#
# Lancement : un tag v<version du Cargo.toml de rust\paymind-appli>, ou à la main (workflow_dispatch : c'est ce que
# fait outils\zip-rust-github.ps1, appelé par outils\publier.ps1, quand GitHub n'a pas encore construit le commit).
#
# Déroulé :
#   1. « construire » : Rust 1.99.1 (rust-toolchain.toml), règles Tauri de la suite (verifier-tauri.ps1 du dépôt
#      Mindset, épinglé au même commit que tests.yml), cargo deny, construction de publication (outils\construire-rust.ps1 :
#      cargo build --release --locked, jamais l'option « essai »), puis Paymind.zip au même format que les autres zips
#      de la suite (outils\zip-rust.ps1, vérifié par outils\verifier-zip-rust.ps1 : exactement Mindset.exe, Paymind.exe
#      et version.json dans « Paymind », fiches de version, aucune trace de la construction d'essai, aucun runtime C à
#      part). Le zip est attesté (attestation GitHub : ce dépôt, ce fichier de construction, ce commit) et déposé comme
#      artefact « Paymind-rust ». outils\publier.ps1 le récupère et vérifie son attestation avant de le signer :
#        gh attestation verify Paymind.zip --repo JordanJacquot/Paymind
#          --signer-workflow JordanJacquot/Paymind/.github/workflows/release.yml --source-digest <commit publié>
#      Le dossier « Paymind » de ce zip est aussi déposé tel quel comme artefact à signer (« Paymind-non-signe »).
#   2. « signer » : seulement quand la variable SIGNPATH_ACTIVE vaut true (Settings > Secrets and variables >
#      Actions > Variables). Envoie l'artefact à SignPath, attend l'approbation manuelle de Jordan dans SignPath,
#      vérifie les signatures, puis dépose Paymind.zip (signé) comme artefact.
#   3. Sur le PC de Jordan : outils\publier.ps1 fait la signature RSA du zip (Paymind.zip.sig, clé privée qui ne quitte
#      jamais le PC) et crée la Release. Ce workflow ne publie rien.
#
# Rien ici n'utilise la clé RSA de la suite : elle ne doit jamais aller sur GitHub.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  construire:
    name: "Construire Paymind"
    runs-on: windows-latest
    # (le jeton OIDC et l'écriture d'attestations : seulement pour ce job)
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
    env:
      CARGO_TERM_COLOR: never
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
      artifact-id: ${{ steps.depot.outputs.artifact-id }}
    steps:
      # Les fichiers tels qu'ils sont dans git : sans ça, git pour Windows change les fins de ligne en CRLF, et le
      # catalogue rangé dans l'exe ne serait plus celui du commit (leçon de la publication de Mindcare du 04/11)
      - name: "Garder les fins de ligne de git"
        run: git config --global core.autocrlf false

      - name: "Récupérer le dépôt"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Le numéro de version : celui du Cargo.toml de paymind-appli (la seule source). Un tag doit être v<ce numéro>.
      - name: "Numéro de version (Cargo.toml de rust/paymind-appli ; un tag doit valoir v<ce numéro>)"
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = 'rust\paymind-appli\Cargo.toml'
          $section = ''; $v = ''
          foreach ($l in [IO.File]::ReadAllLines((Resolve-Path -LiteralPath $cargo).Path, [Text.Encoding]::UTF8)) {
            $l = $l.Trim()
            if ($l.StartsWith('[')) { $section = $l; continue }
            if ($section -eq '[package]' -and $l -match '^version\s*=\s*"(\d+(\.\d+){1,3})"') { $v = $Matches[1]; break }
          }
          if (-not $v) { throw "Version de paymind-appli introuvable ou mal écrite dans $cargo" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$v") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version du Cargo.toml de rust\paymind-appli ($v)."
          }
          $p = @($v.Split('.')); while ($p.Count -lt 4) { $p += '0' }
          $v4 = $p -join '.'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`nversion4=$v4`n")
          Write-Host "Paymind $v ($v4)"

      - name: "Rust 1.99.1, la version figée par rust/rust-toolchain.toml"
        working-directory: rust
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          rustc --version
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }

      - name: "Récupérer les règles Tauri et le contrôle des imports (dépôt Mindset, commit épinglé : outils\\verifier-tauri.ps1, outils\\verifier-imports.ps1)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JordanJacquot/Mindset
          # (le même commit que dans tests.yml : 84c6e7e, Mindset 3.0.6)
          ref: 84c6e7e32230672ce79c09fe14e8bb2a739fb56a
          path: _mindset
          persist-credentials: false

      - name: "Règles Tauri de la suite (verifier-tauri.ps1 sur rust\\paymind-appli)"
        working-directory: rust
        run: |
          & ..\_mindset\outils\verifier-tauri.ps1 -Projet paymind-appli
          exit $LASTEXITCODE

      - name: "cargo deny : licences compatibles MIT, failles connues, liste blanche des bibliothèques (Tauri compris), plugins interdits"
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # cargo-deny 0.20.2 tout prêt, vérifié par son empreinte (la même que dans tests.yml, Mindset et Mindcare)
          $d = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          gh release download 0.20.2 --repo EmbarkStudios/cargo-deny --pattern 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz' --dir $d
          if ($LASTEXITCODE) { exit 1 }
          $archive = Join-Path $d 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          $h = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($h -ne '975A22143262FD27476D19EE00C7AF67978426E40E1DEE94EED6BBADE1CF87DC') { Write-Host "Empreinte inattendue : $h"; exit 1 }
          tar -xzf $archive -C $d
          $exe = Get-ChildItem -LiteralPath $d -Recurse -Filter 'cargo-deny.exe' | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName --locked check
          if ($LASTEXITCODE) { exit 1 }

      # Construction de publication : cargo build --release --locked -p paymind-appli -p paymind-relais, sans l'option
      # « essai » (outils\construire-rust.ps1, le même que dans tests.yml)
      - name: "Construire Paymind (outils\\construire-rust.ps1 : Mindset.exe, Paymind.exe, version.json)"
        run: |
          & .\outils\construire-rust.ps1 -Sortie '_ci\rust'
          if (-not $?) { exit 1 }

      - name: "Paymind.zip (outils\\zip-rust.ps1) et ses contrôles : fichiers exacts, version.json, fiches de version, aucune construction d'essai, aucun runtime C à part"
        run: |
          & .\outils\zip-rust.ps1 -Dossier '_ci\rust\Paymind' -Zip '_ci\rust-zip\Paymind.zip' -VerifierImports '_mindset\outils\verifier-imports.ps1'
          if ($LASTEXITCODE) { exit 1 }
          $h = (Get-FileHash -LiteralPath '_ci\rust-zip\Paymind.zip' -Algorithm SHA256).Hash
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Paymind.zip (${{ steps.version.outputs.version }}, non signé, commit $env:GITHUB_SHA) : SHA-256 ``$h``" + "`n")
          foreach ($e in 'Mindset.exe', 'Paymind.exe') {
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$e (non signé) : SHA-256 ``$((Get-FileHash -LiteralPath "_ci\rust\Paymind\$e" -Algorithm SHA256).Hash)``" + "`n")
          }

      # L'attestation que outils\publier.ps1 vérifie (gh attestation verify --repo JordanJacquot/Paymind
      # --signer-workflow JordanJacquot/Paymind/.github/workflows/release.yml --source-digest <commit>)
      - name: "Attester Paymind.zip (ce dépôt, ce fichier de construction, ce commit)"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _ci/rust-zip/Paymind.zip

      - name: "Déposer Paymind.zip"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paymind-rust
          path: _ci/rust-zip/
          if-no-files-found: error
          retention-days: 30

      # Le dossier Paymind du zip, tel quel (Mindset.exe, Paymind.exe, version.json)
      - name: "Préparer le dossier à signer"
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = '_ci\a-signer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -LiteralPath '_ci\rust-zip\Paymind.zip' -DestinationPath $dest
          foreach ($e in 'Mindset.exe', 'Paymind.exe', 'version.json') {
            if (-not (Test-Path -LiteralPath "$dest\Paymind\$e")) { throw "Dossier à signer inattendu : $dest\Paymind\$e absent" }
          }
          Get-ChildItem -LiteralPath $dest -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) fichiers" }

      # L'artefact contient un seul dossier « Paymind » (Mindset.exe, Paymind.exe, version.json).
      # SignPath vérifie qu'il vient bien de ce workflow (origin verification).
      - name: "Déposer l'artefact non signé"
        id: depot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paymind-non-signe
          path: _ci/a-signer
          if-no-files-found: error
          retention-days: 7

  signer:
    name: "Signer avec SignPath"
    needs: construire
    if: ${{ vars.SIGNPATH_ACTIVE == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Vérifier la configuration SignPath"
        env:
          JETON: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANISATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not $env:JETON) { Write-Host '::error::Le secret SIGNPATH_API_TOKEN est absent.'; exit 1 }
          if (-not $env:ORGANISATION) { Write-Host '::error::La variable SIGNPATH_ORGANIZATION_ID est absente.'; exit 1 }
          Write-Host 'Configuration SignPath présente.'

      # La demande attend l'approbation manuelle de Jordan dans SignPath (politique « release-signing »).
      # Sans artifact-configuration-slug, SignPath prend la configuration d'artefact par défaut du projet.
      - name: "Demande de signature (approbation manuelle dans SignPath)"
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Paymind' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.construire.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: _ci/signe
          parameters: |
            version: "${{ needs.construire.outputs.version4 }}"

      - name: "Vérifier les signatures"
        run: |
          $ErrorActionPreference = 'Stop'
          $racine = '_ci\signe\Paymind'
          foreach ($e in 'Mindset.exe', 'Paymind.exe') { if (-not (Test-Path -LiteralPath "$racine\$e")) { throw "Dossier signé inattendu : $racine\$e absent" } }
          $problemes = @()
          $nos = @(Get-Item -LiteralPath "$racine\Mindset.exe", "$racine\Paymind.exe")
          foreach ($f in $nos) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { $problemes += "$($f.FullName) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          # Aucun autre programme ni script dans le dossier
          # (Where-Object et pas -Include : avec -LiteralPath, PowerShell 5.1 ignore -Include et rend tous les fichiers)
          $autres = @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.ps1', '.psm1', '.psd1' -and $_.FullName -notin $nos.FullName })
          foreach ($f in $autres) { $problemes += "Fichier inattendu : $($f.FullName)" }
          if ($problemes) { $problemes | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "$($nos.Count) fichiers signés par SignPath Foundation."

      - name: "Construire Paymind.zip (signé)"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '_ci\sortie' | Out-Null
          $zip = '_ci\sortie\Paymind.zip'
          Compress-Archive -Path '_ci\signe\Paymind' -DestinationPath $zip -Force
          $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "$h  Paymind.zip" | Out-File -FilePath '_ci\sortie\Paymind.zip.sha256' -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Paymind.zip (${{ needs.construire.outputs.version }}, signé par SignPath) : SHA-256 ``$h``" + "`n")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Demande SignPath : ${{ steps.signpath.outputs.signing-request-web-url }}" + "`n")

      # Récupéré ensuite par outils\publier.ps1 sur le PC de Jordan (signature RSA et Release), le jour où SignPath sera actif
      - name: "Déposer Paymind.zip signé"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paymind-zip-signe
          path: _ci/sortie
          if-no-files-found: error
          retention-days: 30
