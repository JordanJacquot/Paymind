<title>Paymind proposition F</title>
<style>
:root { color-scheme: dark; --police: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --fond: #06050F; --fond2: #0C0920; --carte: rgba(16, 13, 38, 0.82); --carte2: rgba(28, 23, 62, 0.9); --ligne: #2A2450;
  --texte: #ECEAF7; --doux: #A9A3C9; --pale: #6F6894; --P: #22E07A; --S: #00E5FF; --T: #B04BFF; --rouge: #FF5C7A; --orange: #FFB020;
  --vide: color-mix(in srgb, var(--ligne) 50%, var(--fond2)); --r: 20px; --doux-anim: cubic-bezier(.2, .9, .3, 1); }
@property --a-tour { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes tourne { to { --a-tour: 360deg; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--fond); color: var(--texte); font-family: var(--police); }
body { display: flex; flex-direction: column; align-items: center; padding: 18px 16px 24px;
  background: radial-gradient(1200px 600px at 50% 120%, rgba(176, 75, 255, 0.14), transparent 60%), radial-gradient(900px 500px at -10% -20%, rgba(34, 224, 122, 0.08), transparent 60%), var(--fond); }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; text-align: inherit; }
button:focus { outline: none; } button:focus-visible { box-shadow: 0 0 0 2px var(--fond), 0 0 0 4px var(--S); }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.consigne { width: min(1280px, 100%); margin: 0 0 12px; font-size: 15px; color: var(--doux); }
.consigne b { color: var(--texte); }

/* ---------------------------------------------------------------- la fenêtre */
.appli { position: relative; width: min(1280px, 100%); height: 760px; border-radius: 22px; background: linear-gradient(180deg, #0B0920, #070612); isolation: isolate; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
.appli::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 5;
  background: conic-gradient(from var(--a-tour), var(--P), var(--S), var(--T), var(--P));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: tourne 9s linear infinite; opacity: 0.55; }
.haut { flex: none; height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 26px; border-bottom: 1px solid rgba(42, 36, 80, 0.6); }
.marque { display: flex; align-items: center; gap: 11px; font-size: 19px; font-weight: 800; }
.marque svg { width: 32px; height: 32px; }
.haut .jour { margin-left: auto; color: var(--doux); font-size: 14.5px; }
.corps { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 0 0 22px 22px; }
.vue { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ligne) transparent; transition: opacity 380ms ease, transform 420ms var(--doux-anim), filter 380ms ease; }
.vue.cachee { opacity: 0; pointer-events: none; transform: translateX(40px); }
#accueil.cachee { transform: translateX(-40px); }
#accueil.estompe { opacity: 0.14; filter: blur(5px); transform: scale(0.985); pointer-events: none; }

/* ---------------------------------------------------------------- l'accueil */
.accueil-in { padding: 24px 48px 36px; }
.bilan { display: flex; align-items: flex-end; gap: 30px; flex-wrap: wrap; margin-bottom: 26px; }
.total { line-height: 1; }
.total .gros { font-size: 68px; font-weight: 800; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.total .gros small { font-size: 26px; font-weight: 700; color: var(--doux); letter-spacing: 0; margin-left: 10px; }
.total .an { margin-top: 10px; font-size: 18px; color: var(--doux); }
.total .an b { color: var(--texte); font-weight: 700; font-variant-numeric: tabular-nums; }
.bientot { margin-left: auto; display: flex; align-items: center; gap: 10px; padding-bottom: 6px; flex-wrap: wrap; }
.bientot > span { font-size: 13px; color: var(--pale); margin-right: 4px; }
.pas { display: inline-flex; align-items: center; gap: 9px; padding: 5px 14px 5px 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.045); font-size: 14px; color: var(--doux); transition: background 200ms ease; }
.pas:hover { background: rgba(255, 255, 255, 0.09); }
.pas b { color: var(--texte); font-weight: 600; }
.pas .rond { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--c1), var(--c2)); overflow: hidden; }
.pas .rond svg { width: 17px; height: 17px; color: #fff; fill: #fff; }
.pas .rond .pl { background: #fff; border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; }
.pas .rond .pl svg { width: 22px; height: 22px; }
.pas .rond i { font-style: normal; font-weight: 900; font-size: 15px; color: #fff; }

.groupes { display: flex; flex-wrap: wrap; gap: 22px 36px; }
.groupe h2 { margin: 0 0 10px; font-size: 13.5px; font-weight: 600; color: var(--doux); letter-spacing: 0.2px; }
.groupe h2 span { color: var(--pale); margin-left: 8px; font-weight: 500; }
.groupe .rang { display: flex; flex-wrap: wrap; gap: 18px; }

/* ---------------------------------------------------------------- la carte */
.carte { --l: 212px; position: relative; width: var(--l); aspect-ratio: 1.586; border-radius: 6.2cqw; container-type: inline-size; flex: none; cursor: pointer; overflow: hidden; color: #fff;
  background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, 0.16), transparent 55%), linear-gradient(140deg, var(--c1), var(--c2));
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.10); transition: transform 260ms var(--doux-anim), box-shadow 260ms ease, filter 300ms ease, opacity 300ms ease; }
.carte { border-radius: 13px; }
.carte::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0, 0, 0, 0.34)); pointer-events: none; }
.carte:hover { transform: translateY(-5px); box-shadow: 0 18px 34px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
.carte .reflet { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 250ms ease;
  background: radial-gradient(60cqw 60cqw at var(--mx, 30%) var(--my, 20%), rgba(255, 255, 255, 0.24), transparent 70%); }
.carte:hover .reflet, .carte.grande .reflet { opacity: 1; }
.c-haut { position: absolute; left: 7.5cqw; right: 6cqw; top: 7cqw; display: flex; align-items: flex-start; justify-content: space-between; gap: 3cqw; }
.c-logo { display: flex; align-items: center; min-width: 0; }
.c-logo .dofus-logo { height: 27cqw; margin: -4cqw 0 -4cqw -2cqw; width: auto; filter: drop-shadow(0 0.4cqw 0.8cqw rgba(0, 0, 0, 0.35)); }
.rond .dofus-oeuf { width: 78%; height: 78%; object-fit: contain; }
.c-logo svg.lg { display: block; height: 17cqw; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25)); }
.c-logo.nu svg.lg { fill: initial; }
.c-logo.plaque { background: #fff; border-radius: 2.6cqw; padding: 2.2cqw 3.2cqw; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.c-logo.plaque svg.lg { height: 10.5cqw; fill: initial; filter: none; }
.c-logo .picto { width: 17cqw; height: 17cqw; border-radius: 4.5cqw; display: grid; place-items: center; background: rgba(255, 255, 255, 0.18); }
.c-logo .picto svg { width: 10cqw; height: 10cqw; }
.c-logo .picto.dofus { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4F1D0, #C9C08A 60%, #8F8650); box-shadow: inset 0 -1.2cqw 0 rgba(0, 0, 0, 0.18); }
.c-logo .picto.dofus i { font-style: normal; font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 11cqw; color: #3E4A16; }
.c-logo .nom { margin-left: 3.5cqw; font-size: 7.6cqw; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-etq { text-align: right; flex: none; }
.c-etq span { display: block; font-size: 5.6cqw; font-weight: 700; opacity: 0.92; }
.c-etq em { display: block; margin-top: 0.6cqw; font-style: normal; font-size: 4.4cqw; opacity: 0.55; }
.c-bas { position: absolute; left: 7.5cqw; right: 7cqw; bottom: 6.5cqw; display: flex; align-items: flex-end; justify-content: space-between; gap: 3cqw; z-index: 1; }
.c-gauche { min-width: 0; display: flex; flex-direction: column; gap: 1cqw; }
.c-nom { font-size: 7.4cqw; font-weight: 800; line-height: 1.1; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.c-proch { font-size: 5.8cqw; opacity: 0.9; white-space: nowrap; padding-bottom: 0.6cqw; }
.c-prix { font-size: 10.4cqw; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1; text-align: right; }
.c-prix small { display: block; font-size: 4.8cqw; font-weight: 600; opacity: 0.8; margin-bottom: 1cqw; }
.carte.pause { filter: grayscale(1) brightness(0.62); }
.carte.pause .c-proch::before { content: "En pause"; font-weight: 800; }
.carte.pause .c-proch span { display: none; }
.carte.nouvelle { animation: arrive 900ms var(--doux-anim); }
@keyframes arrive { 0% { transform: scale(0.6) translateY(20px); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: none; } }
.carte.cache { visibility: hidden; }

.ajouter { width: 212px; aspect-ratio: 1.586; border-radius: 13px; border: 2px dashed color-mix(in srgb, var(--P) 35%, var(--ligne)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--doux); font-size: 15.5px; font-weight: 700; transition: all 220ms ease; }
.ajouter svg { width: 30px; height: 30px; color: var(--P); }
.ajouter:hover { border-color: var(--P); color: var(--texte); background: rgba(34, 224, 122, 0.06); transform: translateY(-5px); }

/* ---------------------------------------------------------------- la carte agrandie et sa fiche */
#scene { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
#scene.ouverte { pointer-events: auto; }
#scene .fond { position: absolute; inset: 0; }
#volante { position: absolute; z-index: 2; margin: 0; cursor: default; }
#volante:hover { transform: none; }
#volante.anim { transition: transform 520ms var(--doux-anim); }
.fermer { position: absolute; left: 26px; top: 22px; z-index: 3; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px 0 12px; border-radius: 99px; border: 1px solid var(--ligne); background: var(--carte); font-size: 15px; font-weight: 600; opacity: 0; transition: opacity 300ms ease, border-color 200ms ease; }
.fermer svg { width: 20px; height: 20px; }
.fermer:hover { border-color: var(--P); }
#scene.ouverte .fermer { opacity: 1; }
.fiche { position: absolute; left: 50%; top: 284px; width: min(800px, calc(100% - 40px)); transform: translate(-50%, 24px); opacity: 0; transition: opacity 360ms ease 160ms, transform 460ms var(--doux-anim) 160ms; display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: var(--r); background: var(--carte); border: 1px solid rgba(42, 36, 80, 0.8); }
#scene.ouverte .fiche { opacity: 1; transform: translate(-50%, 0); }
.f-col { padding: 22px 26px 22px; }
.f-col + .f-col { border-left: 1px solid rgba(42, 36, 80, 0.8); }
.f-titre { font-size: 21px; font-weight: 800; margin: 0 0 16px; display: flex; align-items: baseline; gap: 10px; }
.f-titre em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--pale); }
.f-titre input { width: 100%; font-size: 20px; font-weight: 800; background: transparent; border: 0; border-bottom: 1px dashed var(--ligne); padding: 2px 0; outline: none; }
.f-titre input:focus { border-bottom-color: var(--P); }
.lbl { display: block; font-size: 13px; color: var(--doux); margin-bottom: 8px; }
.prix-champ { display: inline-flex; align-items: center; gap: 6px; height: 52px; padding: 0 18px; border-radius: 14px; background: var(--fond2); border: 1px solid var(--ligne); margin-bottom: 16px; transition: border-color 200ms ease; }
.prix-champ:focus-within { border-color: var(--P); }
.prix-champ input { width: 92px; border: 0; background: transparent; outline: none; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.prix-champ span { font-size: 20px; font-weight: 700; color: var(--doux); }
.choix-p { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--fond2); border: 1px solid var(--ligne); margin-bottom: 18px; }
.choix-p button { flex: 1; text-align: center; font-size: 14px; font-weight: 700; color: var(--doux); padding: 9px 6px; border-radius: 99px; transition: all 200ms ease; }
.choix-p button:hover { color: var(--texte); }
.choix-p button.oui { color: #06140C; background: linear-gradient(90deg, var(--P), var(--S)); }
.calc { display: flex; gap: 28px; }
.calc div { font-size: 13px; color: var(--doux); }
.calc b { display: block; margin-top: 3px; font-size: 26px; font-weight: 800; color: var(--texte); font-variant-numeric: tabular-nums; }
.rangf { display: flex; align-items: center; gap: 14px; padding: 13px 0; }
.rangf + .rangf { border-top: 1px solid rgba(42, 36, 80, 0.7); }
.rangf.rappel { padding-bottom: 8px; }
.choix-p.petit { flex-wrap: wrap; margin-bottom: 6px; border-radius: 18px; }
.choix-p.petit button { flex: 1 0 auto; font-size: 13px; padding: 8px 10px; }
.rangf:first-child { padding-top: 2px; }
.rangf .txt { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; }
.rangf .txt small { display: block; font-size: 13px; color: var(--doux); font-weight: 400; margin-top: 2px; }
.rangf .date { font-size: 15.5px; font-weight: 700; text-align: right; }
.rangf .date small { display: block; font-size: 13px; color: var(--P); font-weight: 600; }
.bascule { width: 52px; height: 30px; flex: none; border-radius: 99px; background: var(--vide); border: 1px solid var(--ligne); position: relative; transition: background 250ms ease; }
.bascule::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #CFCDE0; transition: transform 260ms cubic-bezier(.3, 1.4, .5, 1); }
.bascule.oui { border-color: transparent; background: linear-gradient(90deg, var(--P), var(--S)); box-shadow: 0 0 12px rgba(34, 224, 122, 0.4); }
.bascule.oui::after { transform: translateX(22px); background: #fff; }
.f-btns { display: flex; gap: 10px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 99px; font-weight: 700; font-size: 15px; white-space: nowrap; transition: transform 150ms ease, filter 150ms ease, background 200ms ease; }
.btn svg { width: 17px; height: 17px; }
.btn:hover { transform: translateY(-2px); }
.btn.second { background: var(--carte2); border: 1px solid var(--ligne); }
.btn.danger { color: var(--rouge); background: rgba(255, 92, 122, 0.10); border: 1px solid rgba(255, 92, 122, 0.3); }
.btn.danger.sur { color: #1A0610; background: var(--rouge); }
.btn.plein { color: #06140C; background: linear-gradient(90deg, var(--P), var(--S)); }

/* ---------------------------------------------------------------- le catalogue */
.cat-in { padding: 22px 48px 40px; }
.cat-tete { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.retour { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px 0 12px; border-radius: 99px; border: 1px solid var(--ligne); background: var(--carte); font-size: 15px; font-weight: 600; transition: border-color 200ms ease; }
.retour svg { width: 20px; height: 20px; }
.retour:hover { border-color: var(--P); }
.retour .compte { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 99px; background: rgba(34, 224, 122, 0.16); color: var(--P); font-size: 13px; font-weight: 800; display: grid; place-items: center; }
.retour .compte.saute { animation: saute 500ms var(--doux-anim); }
@keyframes saute { 40% { transform: scale(1.5); } }
.cat-tete h1 { margin: 0 0 0 6px; font-size: 26px; font-weight: 800; }
.recherche { margin-left: auto; display: flex; align-items: center; gap: 10px; width: 340px; height: 48px; padding: 0 18px; border-radius: 99px; background: var(--fond2); border: 1px solid var(--ligne); transition: border-color 200ms ease; }
.recherche:focus-within { border-color: var(--P); }
.recherche svg { width: 19px; height: 19px; color: var(--doux); flex: none; }
.recherche input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15.5px; }
.recherche input::placeholder { color: var(--pale); }
.cat-sec { margin-bottom: 26px; }
.cat-sec h2 { margin: 0 0 12px; font-size: 13.5px; font-weight: 600; color: var(--doux); }
.cat-rang { display: flex; flex-wrap: wrap; gap: 14px; }
.mini { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px; transition: transform 220ms var(--doux-anim); }
.mini:hover { transform: translateY(-4px); }
.mini .carte { --l: 150px; pointer-events: none; }
.mini:hover .carte { box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
.mini .carte .c-bas { display: none; }
.mini .carte .c-etq em { display: none; }
.mini .leg { width: 100%; display: flex; justify-content: space-between; gap: 6px; padding: 0 3px; font-size: 13px; }
.mini .leg b { font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.mini .leg span { color: var(--doux); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mini .deja { position: absolute; left: 8px; top: 68px; z-index: 2; display: none; align-items: center; gap: 4px; padding: 3px 8px 3px 6px; border-radius: 99px; background: rgba(6, 5, 15, 0.78); color: var(--P); font-size: 11.5px; font-weight: 700; }
.mini .deja svg { width: 12px; height: 12px; }
.mini.a .deja { display: inline-flex; }
.mini.pop .carte { animation: pop 520ms var(--doux-anim); }
@keyframes pop { 30% { transform: scale(0.9); } 70% { transform: scale(1.06); } }
.perso { width: 200px; aspect-ratio: 1.586; border-radius: 10px; border: 2px dashed var(--ligne); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--doux); font-size: 13.5px; font-weight: 700; text-align: center; padding: 0 10px; transition: all 200ms ease; }
.perso svg { width: 22px; height: 22px; color: var(--P); }
.perso:hover { border-color: var(--P); color: var(--texte); }
.rien { color: var(--doux); font-size: 16px; padding: 40px 0; text-align: center; }
.vole { position: absolute; z-index: 9; pointer-events: none; transition: transform 640ms cubic-bezier(.5, 0, .3, 1), opacity 640ms ease; }

#bulle { position: absolute; left: 50%; bottom: 22px; z-index: 8; transform: translate(-50%, 20px); padding: 11px 20px; border-radius: 99px; background: var(--carte2); border: 1px solid var(--ligne); font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity 220ms ease, transform 300ms var(--doux-anim); white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#bulle.vu { opacity: 1; transform: translate(-50%, 0); }
#bulle b { color: var(--P); }

/* ---------------------------------------------------------------- téléphone */
@media (max-width: 760px) {
  body { padding: 12px 16px; }
  .appli { height: auto; min-height: 720px; }
  .corps { min-height: 680px; }
  .accueil-in, .cat-in { padding: 20px 16px 30px; }
  .total .gros { font-size: 52px; } .total .gros small { font-size: 19px; }
  .bientot { margin-left: 0; }
  .groupe, .groupe .rang, .cat-rang { width: 100%; }
  .groupe .rang .carte, .ajouter { --l: 100%; width: 100%; max-width: 380px; }
  .cat-rang { gap: 12px; } .mini { width: calc(50% - 6px); } .mini .carte { --l: 100%; }
  .recherche { width: 100%; margin-left: 0; }
  .fiche { grid-template-columns: minmax(0, 1fr); width: calc(100% - 24px); }
  .f-col { padding: 18px; }
  .fiche { margin-bottom: 24px; }
  .choix-p button { font-size: 13px; padding: 9px 2px; }
  .rangf .date { font-size: 14px; }
  .f-col + .f-col { border-left: 0; border-top: 1px solid rgba(42, 36, 80, 0.8); }
  .haut .jour { display: none; }
  #scene { overflow-y: auto; }
}
body.instant *, body.instant *::before, body.instant *::after { transition: none !important; }

function logoHTML(cle, petit) {
  const m = MARQUE[cle];
  if (m.mode.startsWith('picto:')) return `<div class="c-logo"><span class="picto">${PICTO[m.mode.slice(6)]}</span></div>`;
  if (m.mode === 'dofus') return `<div class="c-logo"><img class="dofus-logo" src="${DOFUS_LOGO}" alt="Dofus"></div>`;
  const r = RATIO[cle] || 1, haut = m.mode === 'plaque' ? 11.5 : 17, largMax = m.mode === 'plaque' ? 50 : 56;
  const l = Math.min(haut * r, largMax), h = l / r;
  return `<div class="c-logo ${m.mode}"><svg class="lg" style="width:${l.toFixed(2)}cqw;height:${h.toFixed(2)}cqw"><use href="#lg-${cle}" width="100%" height="100%"/></svg></div>`;
}
function carteHTML(a) {
  const m = MARQUE[a.cle];
  return `<div class="carte${a.pause ? ' pause' : ''}" data-id="${a.id}" style="--c1:${m.c1};--c2:${m.c2}" role="button" tabindex="0" aria-label="${a.nom}">
    <div class="c-haut">${logoHTML(a.cle)}<div class="c-etq"><span>${m.etq}</span><em>${a.exemple === false ? '' : 'Exemple'}</em></div></div>
    <div class="c-bas"><div class="c-gauche"><b class="c-nom">${a.nom}</b><span class="c-proch"><span>Prochain : ${court(a.date)}</span></span></div><span class="c-prix"><small>par ${MOT[a.rythme]}</small>${euros(a.prix)}</span></div>
    <i class="reflet"></i></div>`;
}
function pastille(cle) {
  const m = MARQUE[cle];
  let inner;
  if (m.mode.startsWith('picto:')) inner = PICTO[m.mode.slice(6)];
  else if (m.mode === 'dofus') inner = `<img class="dofus-oeuf" src="${DOFUS_OEUF}" alt="">`;
  else if (m.mode === 'mono') inner = `<svg><use href="#lg-${cle}" width="100%" height="100%"/></svg>`;
  else inner = `<span class="pl"><svg><use href="#lg-${cle}" width="100%" height="100%"/></svg></span>`;
  return `<span class="rond" style="--c1:${m.c1};--c2:${m.c2}">${inner}</span>`;
}

function afficherAccueil() {
  const actifs = liste.filter(a => !a.pause);
  const tot = actifs.reduce((s, a) => s + parMois(a), 0);
  $('total').innerHTML = euros(tot, true) + '<small>par mois</small>';
  $('totalAn').innerHTML = 'soit <b>' + euros(tot * 12, true) + '</b> par an';
  const proch = [...actifs].sort((x, y) => x.date - y.date).slice(0, 3);
  $('bientot').innerHTML = '<span>Bientôt</span>' + proch.map(a => `<button class="pas" data-id="${a.id}">${pastille(a.cle)}<b>${court(a.date)}</b></button>`).join('');
  $('groupes').innerHTML = GROUPES.map(([gid, gnom]) => {
    const g = liste.filter(a => MARQUE[a.cle].cat === gid);
    if (!g.length) return '';
    const s = g.filter(a => !a.pause).reduce((t, a) => t + parMois(a), 0);
    return `<div class="groupe"><h2>${gnom}<span>${euros(s, true)} par mois</span></h2><div class="rang">${g.map(carteHTML).join('')}</div></div>`;
  }).join('') + `<div class="groupe"><h2>&nbsp;</h2><div class="rang"><button class="ajouter" id="btnAjouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter</button></div></div>`;
  $('compte').textContent = liste.length;
  liste.forEach(a => { if (a.nouvelle) { const el = document.querySelector(`#groupes .carte[data-id="${a.id}"]`); if (el) el.classList.add('nouvelle'); a.nouvelle = false; } });
}

// Le reflet suit la souris
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.carte');
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
  c.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
});

// ---------------------------------------------------------------- la carte agrandie
let ouvert = null, source = null;
const scene = $('scene');
function cible() {
  const cr = $('corps').getBoundingClientRect();
  const l = Math.min(360, cr.width - 40), h = l / 1.586;
  return { l, h, x: (cr.width - l) / 2, y: cr.width < 700 ? 82 : 22 };
}
function ouvrir(id, sansAnim) {
  const a = liste.find(x => x.id === id); if (!a) return;
  ouvert = a;
  source = document.querySelector(`#groupes .carte[data-id="${id}"]`);
  const t = cible();
  const tmp = document.createElement('div'); tmp.innerHTML = carteHTML(a);
  const v = tmp.firstElementChild; v.id = 'volante'; v.classList.add('grande'); v.removeAttribute('tabindex');
  v.style.setProperty('--l', t.l + 'px'); v.style.left = t.x + 'px'; v.style.top = t.y + 'px';
  const ancienne = $('volante'); if (ancienne) ancienne.remove();
  scene.appendChild(v);
  $('laFiche').style.top = (t.y + t.h + 26) + 'px';
  remplirFiche();
  $('accueil').classList.add('estompe');
  if (source && !sansAnim && !reduit) {
    const cr = $('corps').getBoundingClientRect(), sr = source.getBoundingClientRect();
    const k = sr.width / t.l;
    v.style.transformOrigin = '0 0';
    v.style.transform = `translate(${sr.left - cr.left - t.x}px, ${sr.top - cr.top - t.y}px) scale(${k})`;
    source.classList.add('cache');
    v.getBoundingClientRect();
    v.classList.add('anim'); v.style.transform = '';
  } else if (source) source.classList.add('cache');
  scene.classList.add('ouverte');
  history.replaceState(null, '', '#fiche');
}
function fermer(suppr) {
  if (!ouvert) return;
  const v = $('volante'), a = ouvert;
  ouvert = null;
  scene.classList.remove('ouverte');
  $('accueil').classList.remove('estompe');
  const fin = () => { v.remove(); afficherAccueil(); };
  if (suppr) {
    liste = liste.filter(x => x !== a);
    v.style.transition = 'transform 420ms ease, opacity 420ms ease'; v.style.transform = 'scale(0.6) translateY(60px)'; v.style.opacity = '0';
    setTimeout(fin, reduit ? 0 : 430); bulle(`<b>${a.nom}</b> est retiré de ton portefeuille`);
  } else {
    afficherAccueil();
    const s = document.querySelector(`#groupes .carte[data-id="${a.id}"]`);
    if (s && !reduit) {
      s.classList.add('cache');
      const cr = $('corps').getBoundingClientRect(), sr = s.getBoundingClientRect(), t = cible();
      v.style.transform = `translate(${sr.left - cr.left - t.x}px, ${sr.top - cr.top - t.y}px) scale(${sr.width / t.l})`;
      setTimeout(() => { s.classList.remove('cache'); v.remove(); }, 530);
    } else v.remove();
  }
  history.replaceState(null, '', '#bilan');
}
function majVolante() {
  const v = $('volante'); if (!v || !ouvert) return;
  const tmp = document.createElement('div'); tmp.innerHTML = carteHTML(ouvert);
  const n2 = tmp.firstElementChild;
  v.className = n2.className + ' grande' + (v.classList.contains('anim') ? ' anim' : '');
  v.innerHTML = n2.innerHTML;
}
function remplirFiche() {
  const a = ouvert;
  $('fTitre').innerHTML = a.cle === 'perso' ? `<input id="fNom" value="${a.nom}" aria-label="Nom">` : `${a.nom}<em>Exemple</em>`;
  if (a.cle === 'perso') $('fNom').addEventListener('input', e => { a.nom = e.target.value || 'Mon abonnement'; MARQUE.perso.nom = a.nom; majVolante(); });
  $('fPrix').value = a.prix.toFixed(2).replace('.', ',');
  majCalc();
  document.querySelectorAll('#fRythme button').forEach(b => b.classList.toggle('oui', b.dataset.r === a.rythme));
  const d = a.date;
  $('fProch').innerHTML = `${JOURS[d.getDay()][0].toUpperCase() + JOURS[d.getDay()].slice(1)} ${d.getDate()} ${MOISL[d.getMonth()]}<small>${dans(d)}</small>`;
  $('fAuto').classList.toggle('oui', a.auto); majRappel();
  majPause();
  const s = $('fSuppr'); s.classList.remove('sur'); s.querySelector('span').textContent = 'Supprimer';
}
function majCalc() {
  $('fMois').textContent = euros(parMois(ouvert), true);
  $('fAn').textContent = euros(parMois(ouvert) * 12, true);
}
function majPause() {
  $('fPause').innerHTML = ouvert.pause
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Reprendre'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Mettre en pause';
}
$('fPrix').addEventListener('input', e => {
  const v = parseFloat(e.target.value.replace(/\s/g, '').replace(',', '.'));
  if (!isNaN(v) && v >= 0) { ouvert.prix = v; majCalc(); majVolante(); }
});
$('fRythme').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  ouvert.rythme = b.dataset.r;
  document.querySelectorAll('#fRythme button').forEach(x => x.classList.toggle('oui', x === b));
  majCalc(); majVolante();
});
$('fAuto').onclick = () => { ouvert.auto = !ouvert.auto; $('fAuto').classList.toggle('oui', ouvert.auto); };
// Quand prévenir : -1 jamais, 0 le jour même, 1 la veille, 3 ou 7 jours avant (la veille par défaut)
function majRappel() {
  const j = ouvert.rappel;
  document.querySelectorAll('#fRappel button').forEach(b => b.classList.toggle('oui', Number(b.dataset.j) === j));
  const quand = j < 0 ? '' : j === 0 ? 'le jour même' : j === 1 ? 'la veille' : j + ' jours avant';
  if (j < 0) { $('fRappelTxt').textContent = 'Pas de bulle pour cet abonnement'; return; }
  const d = new Date(ouvert.date); d.setDate(d.getDate() - j);
  $('fRappelTxt').textContent = `Une bulle près de l'horloge ${quand}, le ${JOURS[d.getDay()]} ${d.getDate()} ${MOISL[d.getMonth()]}`;
}
$('fRappel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  ouvert.rappel = Number(b.dataset.j); majRappel();
});
$('fPause').onclick = () => { ouvert.pause = !ouvert.pause; majPause(); majVolante(); };
$('fSuppr').onclick = () => {
  const s = $('fSuppr');
  if (!s.classList.contains('sur')) { s.classList.add('sur'); s.querySelector('span').textContent = 'Oui, supprimer'; return; }
  fermer(true);
};
$('fermer').onclick = () => fermer();
$('sceneFond').onclick = () => fermer();
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (ouvert) fermer(); else if (!$('catalogue').classList.contains('cachee')) montrer('bilan'); } });

$('groupes').addEventListener('click', e => {
  if (e.target.closest('#btnAjouter')) return montrer('ajouter');
  const c = e.target.closest('.carte'); if (c) ouvrir(c.dataset.id);
});
$('groupes').addEventListener('keydown', e => { const c = e.target.closest('.carte'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ouvrir(c.dataset.id); } });
$('bientot').addEventListener('click', e => { const p = e.target.closest('.pas'); if (p) ouvrir(p.dataset.id); });

// ---------------------------------------------------------------- le catalogue
const sansAccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function afficherCatalogue() {
  const q = sansAccent($('cherche').value.trim());
  const possede = new Set(liste.map(a => a.cle));
  let html = '', vu = 0;
  CAT.forEach(c => {
    const items = c.items.map(i => MARQUE[i[0]]).filter(m => !q || sansAccent(m.nom + ' ' + m.etq + ' ' + c.nom).includes(q));
    if (!items.length) return;
    vu += items.length;
    html += `<div class="cat-sec"><h2>${c.nom}</h2><div class="cat-rang">` + items.map(m => {
      const fausse = { id: '', cle: m.cle, nom: m.nom, prix: m.prix, rythme: m.rythme, date: AUJ, exemple: false };
      return `<button class="mini${possede.has(m.cle) ? ' a' : ''}" data-cle="${m.cle}" title="Ajouter ${m.nom}">${carteHTML(fausse).replace(' role="button" tabindex="0"', '')}<span class="leg"><b>${m.nom}</b><span>${euros(m.prix)}${m.rythme === 'an' ? ' par an' : ''}</span></span><span class="deja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Déjà là</span></button>`;
    }).join('') + '</div></div>';
  });
  html += `<div class="cat-sec"><h2>Pas dans la liste ?</h2><div class="cat-rang"><button class="perso" id="perso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Un abonnement à moi</button></div></div>`;
  if (!vu && q) html = `<div class="rien">Rien trouvé pour « ${$('cherche').value.replace(/[<>&"]/g, '')} ».</div>` + html;
  $('rayons').innerHTML = html;
}
$('cherche').addEventListener('input', afficherCatalogue);
function prochaineDate(m) { const d = new Date(AUJ); if (m.rythme === 'an') d.setFullYear(d.getFullYear() + 1); else d.setMonth(d.getMonth() + 1); return d; }
$('rayons').addEventListener('click', e => {
  if (e.target.closest('#perso')) {
    const a = ab('perso', 10, 'mois', prochaineDate(MARQUE.perso), { nom: 'Mon abonnement', exemple: false, nouvelle: true });
    liste.push(a); montrer('bilan');
    setTimeout(() => { const el = document.querySelector(`#groupes .carte[data-id="${a.id}"]`); if (el) el.scrollIntoView({ block: 'center', behavior: reduit ? 'auto' : 'smooth' }); setTimeout(() => ouvrir(a.id), reduit ? 0 : 500); }, reduit ? 0 : 420);
    return;
  }
  const b = e.target.closest('.mini'); if (!b) return;
  const m = MARQUE[b.dataset.cle];
  const a = ab(m.cle, m.prix, m.rythme, prochaineDate(m), { exemple: false, nouvelle: true });
  liste.push(a);
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop', 'a');
  // La petite carte s'envole vers « Mes cartes »
  if (!reduit) {
    const cr = $('corps').getBoundingClientRect(), br = b.querySelector('.carte').getBoundingClientRect(), rr = $('compte').getBoundingClientRect();
    const v = b.querySelector('.carte').cloneNode(true); v.classList.add('vole');
    v.style.left = (br.left - cr.left) + 'px'; v.style.top = (br.top - cr.top) + 'px';
    $('corps').appendChild(v);
    v.getBoundingClientRect();
    v.style.transform = `translate(${rr.left - br.left - br.width / 2 + 12}px, ${rr.top - br.top - br.height / 2 + 12}px) scale(0.12)`; v.style.opacity = '0.2';
    setTimeout(() => { v.remove(); compter(); }, 650);
  } else compter();
  bulle(`<b>${m.nom}</b> ajouté. Tu peux corriger le prix sur sa carte.`);
});
function compter() { const c = $('compte'); c.textContent = liste.length; c.classList.remove('saute'); void c.offsetWidth; c.classList.add('saute'); }
$('catRetour').onclick = () => montrer('bilan');

let tBulle;
function bulle(t) { const b = $('bulle'); b.innerHTML = t; b.classList.add('vu'); clearTimeout(tBulle); tBulle = setTimeout(() => b.classList.remove('vu'), 2600); }

function montrer(ecran) {
  if (ouvert && ecran !== 'fiche') fermer();
  const cat = ecran === 'ajouter';
  $('catalogue').classList.toggle('cachee', !cat);
  $('accueil').classList.toggle('cachee', cat);
  $('compte').textContent = liste.length;
  if (cat) { $('cherche').value = ''; afficherCatalogue(); $('catalogue').scrollTop = 0; }
  else afficherAccueil();
  history.replaceState(null, '', '#' + (cat ? 'ajouter' : 'bilan'));
}
function selonAdresse() {
  const h = location.hash.slice(1);
  if (h === 'ajouter') montrer('ajouter');
  else if (h === 'fiche') { montrer('bilan'); ouvrir(liste[0].id, true); }
  else montrer('bilan');
}
window.addEventListener('hashchange', selonAdresse);
document.body.classList.add('instant');
selonAdresse();
setTimeout(() => document.body.classList.remove('instant'), 80);
})();
</script>
