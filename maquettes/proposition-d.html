<title>Paymind proposition D</title>
<style>
:root { color-scheme: dark;
  --fond: #06050F; --fond2: #0C0920; --carte: rgba(16, 13, 38, 0.82); --carte2: rgba(28, 23, 62, 0.9); --ligne: #2A2450;
  --texte: #ECEAF7; --doux: #A9A3C9; --pale: #6F6894; --P: #00E5FF; --S: #B04BFF; --T: #FF2EB5;
  --vert: #22E07A; --orange: #FFB020; --rouge: #FF5C7A; --r: 20px;
  --police: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
@property --a-tour { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes tourne { to { --a-tour: 360deg; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--fond); color: var(--texte); font-family: var(--police); }
body { background: radial-gradient(1200px 600px at 50% 120%, rgba(176, 75, 255, 0.14), transparent 60%), radial-gradient(900px 500px at -10% -20%, rgba(34, 224, 122, 0.09), transparent 60%), var(--fond); background-attachment: fixed; }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--vert); outline-offset: 2px; }

.page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; gap: 14px; }
.chapeau { font-size: 15px; color: var(--doux); margin: 0; }
.chapeau b { color: var(--texte); }

/* La fenêtre de l'appli, avec son bord de plasma */
.fen { position: relative; width: 1280px; max-width: 100%; height: 760px; border-radius: 24px; background: rgba(10, 8, 26, 0.94); isolation: isolate; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
.fen::before, .fen::after { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--a-tour), var(--vert), var(--P), var(--S), var(--vert));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: tourne 9s linear infinite; opacity: 0.75; }
.fen::after { inset: -5px; padding: 5px; filter: blur(12px); opacity: 0.28; z-index: -1; }

.haut { height: 60px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid rgba(42, 36, 80, 0.7); }
.marque { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
.marque i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #22E07A, #0FA85A); box-shadow: 0 0 14px rgba(34, 224, 122, 0.45); }
.marque i svg { width: 19px; height: 19px; }
.haut .jour { margin-left: auto; color: var(--doux); font-size: 14px; }

.corps { flex: 1; min-height: 0; display: grid; grid-template-columns: 40% 60%; }
.corps > section { min-width: 0; }

/* ---------------- Colonne de gauche : le total et la liste */
.gauche { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid rgba(42, 36, 80, 0.7); }
.total { padding: 26px 30px 18px; }
.total .lbl { font-size: 14px; color: var(--doux); }
.total .gros { font-size: 64px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.total .gros small { font-size: 30px; font-weight: 700; letter-spacing: 0; color: var(--doux); }
.total .an { font-size: 15px; color: var(--doux); margin-top: 4px; font-variant-numeric: tabular-nums; }
.total .an b { color: var(--texte); font-weight: 700; }
.liste { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 96px; scrollbar-width: thin; scrollbar-color: #2A2450 transparent; }
.inter { font-size: 12.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--pale); margin: 18px 12px 8px; }
.inter:first-child { margin-top: 6px; }
.rangee { width: 100%; display: flex; align-items: center; gap: 16px; padding: 10px 12px; border-radius: 18px; position: relative; transition: background 200ms ease; }
.rangee:hover { background: rgba(255, 255, 255, 0.04); }
.rangee.choisie { background: rgba(34, 224, 122, 0.09); }
.rangee.choisie::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--vert); box-shadow: 0 0 10px rgba(34, 224, 122, 0.8); }
.rangee .txt { flex: 1; min-width: 0; }
.rangee .nom { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rangee .quand { font-size: 14px; color: var(--doux); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
.rangee .quand.proche { color: var(--orange); }
.ex { font-size: 11px; font-weight: 600; color: var(--pale); border: 1px solid rgba(111, 104, 148, 0.45); border-radius: 99px; padding: 0 7px; line-height: 17px; }
.rangee .prix { text-align: right; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rangee .prix small { display: block; font-size: 12.5px; font-weight: 500; color: var(--pale); }
.rangee.pause { opacity: 0.5; }
.ajouter { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 28px 0 20px; border-radius: 99px; background: var(--vert); color: #04140B; font-size: 17px; font-weight: 800; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 22px rgba(34, 224, 122, 0.35); transition: transform 200ms ease, box-shadow 200ms ease; }
.ajouter:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 30px rgba(34, 224, 122, 0.55); }
.ajouter svg { width: 22px; height: 22px; }
.gauche::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 110px; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(10, 8, 26, 0.96) 70%); }
.gauche .ajouter { z-index: 2; }

/* Les tuiles de logo */
.logo { flex: none; display: grid; place-items: center; overflow: hidden; border-radius: 28%; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 6px 16px rgba(0, 0, 0, 0.35); }
.logo svg, .logo img { width: 100%; height: 100%; display: block; object-fit: contain; }
.logo .lettre { font-weight: 800; color: #F6EBC8; line-height: 1; }

/* ---------------- Colonne de droite */
.droite { position: relative; min-height: 0; overflow: hidden; }
.vue { position: absolute; inset: 0; overflow-y: auto; padding: 28px 36px 36px; scrollbar-width: thin; scrollbar-color: #2A2450 transparent; }
.fen.pret .vue { animation: entre 380ms cubic-bezier(.2, .9, .3, 1); }
@keyframes entre { from { opacity: 0; transform: translateY(14px); } }
.retour { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 10px; border-radius: 99px; color: var(--doux); font-size: 15px; font-weight: 600; transition: background 200ms, color 200ms; }
.retour:hover { background: rgba(255, 255, 255, 0.06); color: var(--texte); }
.retour svg { width: 20px; height: 20px; }
h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.3px; }
.sous { color: var(--doux); font-size: 15px; margin: 6px 0 0; }

/* Le bilan */
.bilan { display: flex; flex-direction: column; height: 100%; }
.bilan .zone { flex: 1; display: grid; grid-template-columns: 300px 1fr; gap: 40px; align-items: center; margin-top: 10px; }
.anneau { position: relative; width: 300px; height: 300px; }
.anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anneau circle { transition: stroke-width 200ms ease, opacity 200ms ease; }
.anneau .centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.anneau .centre b { font-size: 52px; font-weight: 800; line-height: 1; }
.anneau .centre span { color: var(--doux); font-size: 15px; margin-top: 6px; }
.legende { display: flex; flex-direction: column; gap: 4px; }
.leg { display: grid; grid-template-columns: 14px 1fr auto 50px; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; transition: background 200ms; }
.leg:hover, .leg.on { background: rgba(255, 255, 255, 0.05); }
.leg i { width: 14px; height: 14px; border-radius: 50%; }
.leg b { font-size: 16px; font-weight: 700; }
.leg .m { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.leg .m small { color: var(--pale); font-weight: 500; font-size: 13px; }
.leg .pc { color: var(--doux); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
.astuce { color: var(--pale); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.astuce svg { width: 18px; height: 18px; }

/* La fiche */
.fiche { padding: 16px 32px 24px; }
.banniere { position: relative; border-radius: 26px; padding: 22px 26px; display: flex; align-items: center; gap: 24px; overflow: hidden; margin-top: 10px; }
.banniere::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 140% at 100% 0%, rgba(255, 255, 255, 0.16), transparent 50%), linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.28)); pointer-events: none; }
.banniere .logo { position: relative; z-index: 1; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22), 0 12px 30px rgba(0, 0, 0, 0.45); }
.banniere .t { position: relative; z-index: 1; min-width: 0; color: #fff; }
.banniere h2 { font-size: 34px; color: #fff; }
.banniere .cat { font-size: 15px; color: rgba(255, 255, 255, 0.85); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
.banniere .cat .ex { color: rgba(255, 255, 255, 0.85); border-color: rgba(255, 255, 255, 0.45); }
.banniere .etat { position: relative; z-index: 1; margin-left: auto; text-align: right; color: #fff; font-size: 15px; }
.banniere .etat b { display: block; font-size: 20px; }
.reglages { margin-top: 8px; }
.reg { display: flex; align-items: center; gap: 18px; padding: 12px 4px; border-bottom: 1px solid rgba(42, 36, 80, 0.6); }
.reg:last-child { border-bottom: 0; }
.reg .lib { flex: 1; min-width: 0; }
.reg .lib b { display: block; font-size: 16.5px; font-weight: 700; }
.reg .lib span { color: var(--doux); font-size: 14px; }
.champPrix { display: flex; align-items: baseline; gap: 6px; height: 52px; padding: 0 18px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--ligne); transition: border-color 200ms; }
.champPrix:focus-within { border-color: var(--vert); }
.champPrix input { width: 110px; border: 0; background: transparent; outline: none; font-size: 26px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; line-height: 50px; }
.champPrix span { font-size: 20px; font-weight: 700; color: var(--doux); }
.pastilles { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--ligne); }
.pastilles button { padding: 9px 16px; border-radius: 99px; font-size: 15px; font-weight: 700; color: var(--doux); transition: background 200ms, color 200ms; }
.pastilles button:hover { color: var(--texte); }
.pastilles button.on { background: var(--vert); color: #04140B; }
.date { position: relative; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--ligne); font-size: 16px; font-weight: 700; }
.date svg { width: 19px; height: 19px; color: var(--vert); }
.date input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.inter-r { width: 56px; height: 32px; border-radius: 99px; background: #1A1738; border: 1px solid var(--ligne); position: relative; flex: none; transition: background 250ms ease, border-color 250ms; }
.inter-r::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #CFCDE0; transition: transform 260ms cubic-bezier(.3, 1.4, .5, 1); }
.inter-r.on { background: var(--vert); border-color: transparent; box-shadow: 0 0 12px rgba(34, 224, 122, 0.5); }
.inter-r.on::after { transform: translateX(24px); background: #fff; }
.actions { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.bouton { display: inline-flex; align-items: center; gap: 9px; height: 48px; padding: 0 22px; border-radius: 99px; font-size: 15.5px; font-weight: 700; background: rgba(255, 255, 255, 0.07); transition: background 200ms; }
.bouton:hover { background: rgba(255, 255, 255, 0.12); }
.bouton svg { width: 19px; height: 19px; }
.bouton.danger { color: var(--rouge); background: rgba(255, 92, 122, 0.08); }
.bouton.danger:hover { background: rgba(255, 92, 122, 0.16); }
.bouton.plein { background: var(--vert); color: #04140B; font-weight: 800; }
.bouton.plein:hover { background: #3BEB8C; }
.bouton.rouge { background: var(--rouge); color: #1A0309; font-weight: 800; }
.confirme { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--texte); font-size: 15.5px; }

/* Le catalogue */
.cata { padding: 22px 32px 32px; }
.cata .tete { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; }
.recherche { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 20px; border-radius: 99px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--ligne); transition: border-color 200ms; }
.recherche:focus-within { border-color: var(--vert); }
.recherche svg { width: 21px; height: 21px; color: var(--doux); flex: none; }
.recherche input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 17px; }
.recherche input::placeholder { color: var(--pale); }
.cats { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 22px; }
.cats button { padding: 8px 16px; border-radius: 99px; font-size: 14.5px; font-weight: 700; color: var(--doux); background: rgba(255, 255, 255, 0.05); transition: background 200ms, color 200ms; }
.cats button:hover { color: var(--texte); background: rgba(255, 255, 255, 0.09); }
.cats button.on { background: var(--vert); color: #04140B; }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 22px 14px; }
.app { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 12px 6px; border-radius: 20px; transition: background 200ms, transform 250ms cubic-bezier(.2, .9, .3, 1); }
.app:hover { background: rgba(255, 255, 255, 0.05); transform: translateY(-3px); }
.app .nom { font-size: 15px; font-weight: 700; line-height: 1.2; }
.app .p { font-size: 13px; color: var(--doux); margin-top: -6px; }
.app.moi .logo { background: transparent; border: 2px dashed rgba(34, 224, 122, 0.6); box-shadow: none; color: var(--vert); }
.rien { color: var(--doux); padding: 30px 0; text-align: center; font-size: 16px; }

/* La petite fiche d'ajout */
.voile { position: absolute; inset: 0; z-index: 5; background: rgba(6, 5, 15, 0.62); backdrop-filter: blur(6px); display: grid; place-items: center; animation: fondu 250ms ease; }
@keyframes fondu { from { opacity: 0; } }
.carte { position: relative; width: 430px; max-width: calc(100% - 32px); border-radius: 26px; background: #120F2C; padding: 26px; isolation: isolate; animation: monte 320ms cubic-bezier(.2, .9, .3, 1); }
@keyframes monte { from { opacity: 0; transform: translateY(18px) scale(0.97); } }
.carte::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--a-tour), var(--vert), var(--P), var(--S), var(--vert));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: tourne 7s linear infinite; opacity: 0.9; }
.carte .entete { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.carte h3 { margin: 0; font-size: 23px; font-weight: 800; }
.carte .entete span { color: var(--doux); font-size: 14px; }
.carte .champ { margin-bottom: 16px; }
.carte .champ > label { display: block; font-size: 14px; color: var(--doux); margin-bottom: 8px; }
.carte .champPrix { width: 100%; }
.carte .champPrix input { flex: 1; text-align: left; }
.carte .texte { width: 100%; height: 50px; padding: 0 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--ligne); outline: none; font-size: 17px; font-weight: 700; }
.carte .texte:focus { border-color: var(--vert); }
.carte .pastilles { display: inline-flex; }
.carte .pastilles button { padding: 8px 13px; font-size: 14.5px; }
.carte .bas { display: flex; gap: 10px; margin-top: 22px; }
.carte .bas .plein { flex: 1; justify-content: center; }
.carte .date { width: 100%; }

.bulle { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 8; display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 99px; background: #17133A; border: 1px solid rgba(34, 224, 122, 0.55); font-size: 15px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); animation: bulle 3s ease forwards; white-space: nowrap; }
.bulle svg { width: 18px; height: 18px; color: var(--vert); }
@keyframes bulle { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Téléphone : une seule colonne */
@media (max-width: 900px) {
  .page { padding: 16px; justify-content: flex-start; }
  .fen { height: auto; }
  .haut .jour { display: none; }
  .corps { grid-template-columns: minmax(0, 1fr); }
  .pastilles { flex-wrap: wrap; border-radius: 22px; }
  .chapeau { text-align: center; }
  .gauche { border-right: 0; border-bottom: 1px solid rgba(42, 36, 80, 0.7); }
  .gauche::after { display: none; }
  .total { padding: 22px 20px 10px; }
  .total .gros { font-size: 52px; }
  .liste { overflow: visible; padding: 4px 8px 16px; }
  .ajouter { position: static; transform: none; margin: 4px auto 22px; align-self: center; }
  .ajouter:hover { transform: translateY(-2px); }
  .droite { overflow: visible; }
  .vue { position: relative; inset: auto; overflow: visible; padding: 20px 16px 28px; }
  .bilan .zone { grid-template-columns: 1fr; gap: 20px; justify-items: center; }
  .anneau { width: 240px; height: 240px; }
  .legende { width: 100%; }
  .banniere { flex-wrap: wrap; padding: 20px; gap: 16px; }
  .banniere .etat { margin-left: 0; text-align: left; width: 100%; }
  .banniere h2 { font-size: 28px; }
  .reg { flex-wrap: wrap; }
  .reg .lib { flex-basis: 100%; }
  .fiche, .cata { padding: 20px 16px 28px; }
  .grille { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .voile { position: fixed; }
}
</style>

<div class="page">
  <p class="chapeau"><b>Proposition D : Liste et détail.</b> Clique pour essayer.</p>
  <div class="fen">
    <div class="haut">
      <div class="marque"><i><svg viewBox="0 0 24 24" fill="none" stroke="#04140B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19V5h5.5a4 4 0 0 1 0 8H8"/></svg></i>Paymind</div>
      <div class="jour">Samedi 14 novembre 2026</div>
    </div>
    <div class="corps">
      <section class="gauche">
        <div class="total">
          <div class="lbl">Tu paies chaque mois</div>
          <div class="gros" id="totMois"></div>
          <div class="an" id="totAn"></div>
        </div>
        <div class="liste" id="liste"></div>
        <button class="ajouter" id="btnAjouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter</button>
      </section>
      <section class="droite" id="droite"></section>
    </div>
  </div>

// ---------- outils
const euros = (v, d = 2) => v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' €';
const mensuel = a => a.pause ? 0 : a.prix * PAR_MOIS[a.rythme];
const jours = d => Math.round((d - AUJ) / JOUR);
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const dateLongue = d => `${JOURS[d.getDay()]} ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS[d.getMonth()]}${d.getFullYear() !== 2026 ? ' ' + d.getFullYear() : ''}`;
function quand(d) {
  const j = jours(d);
  if (j <= 0) return "aujourd'hui"; if (j === 1) return 'demain';
  if (j <= 45) return `dans ${j} jours`;
  return `le ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS[d.getMonth()]}`;
}
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const lirePrix = s => { const v = parseFloat(String(s).replace(/\s/g, '').replace('€', '').replace(',', '.')); return isFinite(v) && v >= 0 ? v : null; };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

function logo(id, t) {
  const r = `width:${t}px;height:${t}px;`;
  if (id === 'dofus') return `<div class="logo" style="${r}background:linear-gradient(145deg,#6E9E2E,#2F4D14)"><span class="lettre" style="font-size:${t * 0.5}px;font-family:Georgia,serif">D</span></div>`;
  if (id === 'moi') return `<div class="logo" style="${r}">${ico(PICTOS.plus, 2.2).replace('<svg', `<svg style="width:${t * 0.42}px;height:${t * 0.42}px"`)}</div>`;
  if (id.startsWith('p:')) {
    const k = id.slice(2), [a, b] = PICTO_BG[k];
    return `<div class="logo" style="${r}background:linear-gradient(145deg,${a},${b});color:#fff">${ico(PICTOS[k], 1.8).replace('<svg', `<svg style="width:${t * 0.56}px;height:${t * 0.56}px"`)}</div>`;
  }
  const L = LOGOS[id]; if (!L) return `<div class="logo" style="${r}background:#2A2450"></div>`;
  const pad = (L.pad ?? 20) / 100 * t;
  if (L.t === 'g') return `<div class="logo" style="${r}background:${L.bg};padding:${pad}px"><svg viewBox="${L.vb}">${L.d.map(d => `<path fill="${L.fg}" d="${d}"/>`).join('')}</svg></div>`;
  return `<div class="logo" style="${r}background:${L.bg};padding:${pad}px"><img alt="" src="${L.src}"></div>`;
}
function fonce(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(v * k).toString(16).padStart(2, '0'); return '#' + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255); }

// ---------- le total, avec une petite animation de compteur
let affiche = null;
function rendreTotal() {
  const cible = ABOS.reduce((s, a) => s + mensuel(a), 0);
  const ecrire = v => {
    const t = euros(v).replace(' €', ''); const [ent, cts] = t.split(',');
    document.getElementById('totMois').innerHTML = `${ent}<small>,${cts} €</small>`;
  };
  document.getElementById('totAn').innerHTML = `soit <b>${euros(cible * 12)}</b> par an`;
  if (affiche === null || doux.matches) { affiche = cible; ecrire(cible); return; }
  const de = affiche, t0 = performance.now();
  const pas = t => { const p = Math.min(1, (t - t0) / 420), e = 1 - Math.pow(1 - p, 3); ecrire(de + (cible - de) * e); if (p < 1) requestAnimationFrame(pas); };
  affiche = cible; requestAnimationFrame(pas);
}

// ---------- la liste, triée par prochain paiement et regroupée
function rendreListe() {
  const tri = [...ABOS].sort((a, b) => a.date - b.date);

    if (a.pause) groupes[3][1].push(a);
    else if (j <= 7) groupes[0][1].push(a);
    else if (a.date.getMonth() === AUJ.getMonth() && a.date.getFullYear() === AUJ.getFullYear()) groupes[1][1].push(a);
    else groupes[2][1].push(a);
  }
  document.getElementById('liste').innerHTML = groupes.filter(g => g[1].length).map(([titre, l]) => `<div class="inter">${titre}</div>` + l.map(a => `
    <button class="rangee${etat.choisi === a.id && etat.vue === 'fiche' ? ' choisie' : ''}${a.pause ? ' pause' : ''}" data-id="${a.id}">
      ${logo(a.logo, 52)}
      <div class="txt"><div class="nom">${esc(a.nom)}</div>
        <div class="quand${!a.pause && jours(a.date) <= 3 ? ' proche' : ''}">${a.pause ? 'En pause' : quand(a.date)}${a.exemple ? '<span class="ex">Exemple</span>' : ''}</div></div>
      <div class="prix">${euros(a.prix)}<small>${PAR[a.rythme]}</small></div>
    </button>`).join('')).join('');
}

// ---------- la droite : bilan, fiche ou catalogue
const D = () => document.getElementById('droite');
function rendreDroite() {
  if (etat.vue === 'fiche' && ABOS.find(a => a.id === etat.choisi)) return rendreFiche();
  if (etat.vue === 'ajouter') return rendreCatalogue();
  etat.vue = 'bilan'; rendreBilan();
}

function rendreBilan() {
  const parts = {};
  for (const a of ABOS) if (!a.pause) parts[a.cat] = (parts[a.cat] || 0) + mensuel(a);
  const tot = Object.values(parts).reduce((s, v) => s + v, 0) || 1;
  const liste = Object.entries(parts).sort((a, b) => b[1] - a[1]);
  const R = 120, C = 2 * Math.PI * R, ecart = liste.length > 1 ? 5 : 0;
  let pos = 0;
  const arcs = liste.map(([k, v]) => {
    const long = Math.max(0, v / tot * C - ecart);
    const s = `<circle data-cat="${k}" cx="150" cy="150" r="${R}" fill="none" stroke="${CATS[k].c}" stroke-width="30" stroke-dasharray="${long} ${C - long}" stroke-dashoffset="${-pos}"/>`;
    pos += v / tot * C; return s;
  }).join('');
  const actifs = ABOS.filter(a => !a.pause).length;
  D().innerHTML = `<div class="vue bilan">
    <h2>Où va ton argent</h2><p class="sous">Chaque mois, par catégorie</p>
    <div class="zone">
      <div class="anneau"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="${R}" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="30"/>${arcs}</svg>
        <div class="centre"><b>${actifs}</b><span>abonnement${actifs > 1 ? 's' : ''}</span></div></div>
      <div class="legende">${liste.map(([k, v]) => `<div class="leg" data-cat="${k}"><i style="background:${CATS[k].c}"></i><b>${CATS[k].nom}</b><span class="m">${euros(v)}</span><span class="pc">${Math.round(v / tot * 100)} %</span></div>`).join('')}</div>
    </div>
    <div class="astuce">${ico('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>')}Choisis un abonnement à gauche pour le modifier.</div>
  </div>`;
  D().querySelectorAll('.leg').forEach(l => {
    const arc = D().querySelector(`circle[data-cat="${l.dataset.cat}"]`);
    l.onmouseenter = () => { arc.setAttribute('stroke-width', 38); };
    l.onmouseleave = () => { arc.setAttribute('stroke-width', 30); };
  });
}

function rendreFiche() {
  const a = ABOS.find(x => x.id === etat.choisi);
  const j = jours(a.date);
  D().innerHTML = `<div class="vue fiche">
    <button class="retour" data-act="bilan">${ico('<path d="M15 5l-7 7 7 7"/>')}Bilan</button>
    <div class="banniere" style="background:linear-gradient(120deg, ${a.couleur}, ${fonce(a.couleur, 0.45)})">
      ${logo(a.logo, 92)}
      <div class="t"><h2>${esc(a.nom)}</h2><div class="cat">${CATS[a.cat].nom}${a.exemple ? '<span class="ex">Exemple</span>' : ''}</div></div>
      <div class="etat" id="fEtat"></div>
    </div>
    <div class="reglages">
      <div class="reg"><div class="lib"><b>Prix</b><span id="fEquiv"></span></div>
        <label class="champPrix"><input id="fPrix" inputmode="decimal" value="${prixTxt(a.prix)}" aria-label="Prix"><span>€</span></label></div>
      <div class="reg"><div class="lib"><b>Rythme</b><span>Tous les combien tu paies</span></div>
        <div class="pastilles" id="fRythme">${RYTHMES.map(([k, l]) => `<button data-r="${k}" class="${a.rythme === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <div class="reg"><div class="lib"><b>Prochain paiement</b><span id="fQuand">${a.pause ? 'En pause' : quand(a.date)}</span></div>
        <label class="date">${ico('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>', 1.8)}<span id="fDate">${dateLongue(a.date)}</span><input type="date" id="fDateIn" value="${iso(a.date)}" aria-label="Date du prochain paiement"></label></div>
      <div class="reg"><div class="lib"><b>Renouvellement automatique</b><span>Il repart tout seul à chaque échéance</span></div>
        <button class="inter-r${a.auto ? ' on' : ''}" data-act="auto" aria-label="Renouvellement automatique"></button></div>
      <div class="reg"><div class="lib"><b>Me prévenir 7 jours avant</b><span>Une bulle près de l'horloge</span></div>
        <button class="inter-r${a.rappel ? ' on' : ''}" data-act="rappel" aria-label="Rappel"></button></div>
    </div>
    <div class="actions" id="fActions"></div>
  </div>`;
  majFicheTextes(a); rendreActions(a);
  const p = document.getElementById('fPrix');
  p.oninput = () => { const v = lirePrix(p.value); if (v !== null) { a.prix = v; majTout(a); } };
  p.onblur = () => { p.value = prixTxt(a.prix); };
  p.onkeydown = e => { if (e.key === 'Enter') p.blur(); };
  document.getElementById('fRythme').onclick = e => {
    const b = e.target.closest('button'); if (!b) return; a.rythme = b.dataset.r;
    document.querySelectorAll('#fRythme button').forEach(x => x.classList.toggle('on', x === b)); majTout(a);
  };
  const di = document.getElementById('fDateIn');
  di.onclick = () => { try { di.showPicker(); } catch (e) { } };
  di.onchange = () => { if (!di.value) return; const [y, m, d] = di.value.split('-').map(Number); a.date = new Date(y, m - 1, d); document.getElementById('fDate').textContent = dateLongue(a.date); majTout(a); };
}
function majFicheTextes(a) {
  document.getElementById('fEquiv').textContent = a.rythme === 'an' ? `soit ${euros(a.prix / 12)} par mois` : `soit ${euros(a.prix * PAR_MOIS[a.rythme] * 12)} par an`;
  document.getElementById('fEtat').innerHTML = a.pause ? '<b>En pause</b>Ne compte plus dans le total' : `<b>${euros(a.prix)}</b>${PAR[a.rythme]}`;
  const q = document.getElementById('fQuand'); if (q) q.textContent = a.pause ? 'En pause' : quand(a.date);
}
function rendreActions(a) {
  const z = document.getElementById('fActions');
  if (etat.confirmeSuppr) {
    z.innerHTML = `<div class="confirme">Retirer ${esc(a.nom)} de ta liste ?<button class="bouton rouge" data-act="supprOui">Oui, supprimer</button><button class="bouton" data-act="supprNon">Non</button></div>`;
  } else {
    z.innerHTML = `<button class="bouton" data-act="pause">${a.pause ? ico('<path d="M7 5l12 7-12 7z"/>') + 'Reprendre' : ico('<path d="M8 5v14M16 5v14"/>') + 'Mettre en pause'}</button>
      <button class="bouton danger" data-act="suppr">${ico('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>')}Supprimer</button>`;
  }
}
function majTout(a) { rendreTotal(); rendreListe(); if (a) majFicheTextes(a); }

function rendreCatalogue() {
  D().innerHTML = `<div class="vue cata">
    <div class="tete"><button class="retour" data-act="bilan">${ico('<path d="M15 5l-7 7 7 7"/>')}Retour</button></div>
    <h2>Ajouter un abonnement</h2><p class="sous" style="margin-bottom:18px">Choisis-le dans la liste. Le prix habituel est déjà rempli.</p>
    <label class="recherche">${ico('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', 1.9)}<input id="cRech" placeholder="Chercher : Netflix, Free, mutuelle..." value="${esc(etat.recherche)}"></label>
    <div class="cats" id="cCats">${[['tout', 'Tout'], ...Object.entries(CATS).filter(([k]) => k !== 'autre').map(([k, v]) => [k, v.nom])].map(([k, l]) => `<button data-c="${k}" class="${etat.cat === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="grille" id="cGrille"></div>
  </div>`;
  rendreGrille();
  const r = document.getElementById('cRech');
  r.oninput = () => { etat.recherche = r.value; rendreGrille(); };
  document.getElementById('cCats').onclick = e => {
    const b = e.target.closest('button'); if (!b) return; etat.cat = b.dataset.c;
    document.querySelectorAll('#cCats button').forEach(x => x.classList.toggle('on', x === b)); rendreGrille();
  };
}
const sansAccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function rendreGrille() {
  const q = sansAccent(etat.recherche.trim());
  const l = CATA.map((c, i) => ({ c, i })).filter(({ c }) => (etat.cat === 'tout' || c.cat === etat.cat) && (!q || sansAccent(c.nom + ' ' + CATS[c.cat].nom).includes(q)));
  const moi = `<button class="app moi" data-i="moi">${logo('moi', 76)}<div class="nom">Un abonnement à moi</div><div class="p">Je tape tout</div></button>`;
  document.getElementById('cGrille').innerHTML = l.map(({ c, i }) => `<button class="app" data-i="${i}">${logo(c.logo, 76)}<div class="nom">${esc(c.nom)}</div><div class="p">${euros(c.prix)} ${PAR[c.rythme].replace('par ', '/ ')}</div></button>`).join('') + moi
    + (l.length ? '' : `<div class="rien" style="grid-column:1/-1">Rien trouvé pour « ${esc(etat.recherche)} ». Tu peux l'ajouter toi-même.</div>`);
}

// La petite fiche pré-remplie
function ouvrirAjout(i) {
  const c = i === 'moi' ? { logo: 'moi', nom: '', cat: 'autre', prix: 10, rythme: 'mois', couleur: '#3A3470', moi: true } : CATA[i];
  const d = new Date(AUJ); d.setMonth(d.getMonth() + 1);
  etat.ajout = { ...c, prixTxt: prixTxt(c.prix), date: d };
  const A = etat.ajout;
  const v = document.createElement('div'); v.className = 'voile'; v.id = 'voile';
  v.innerHTML = `<div class="carte" role="dialog" aria-label="Ajouter">
    <div class="entete">${logo(A.logo, 64)}<div><h3>${A.moi ? 'Un abonnement à moi' : esc(A.nom)}</h3><span>${A.moi ? 'Remplis ce que tu sais' : CATS[A.cat].nom}</span></div></div>
    ${A.moi ? `<div class="champ"><label for="aNom">Son nom</label><input class="texte" id="aNom" placeholder="Par exemple : Cours de piano"></div>` : ''}
    <div class="champ"><label for="aPrix">${A.moi ? 'Le prix' : 'Prix habituel, corrige-le si besoin'}</label><label class="champPrix"><input id="aPrix" inputmode="decimal" value="${A.prixTxt}"><span>€</span></label></div>
    <div class="champ"><label>Rythme</label><div class="pastilles" id="aRythme">${RYTHMES.map(([k, l]) => `<button data-r="${k}" class="${A.rythme === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="champ"><label>Prochain paiement</label><label class="date">${ico('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>', 1.8)}<span id="aDate">${dateLongue(A.date)}</span><input type="date" id="aDateIn" value="${iso(A.date)}"></label></div>
    <div class="bas"><button class="bouton" data-act="annuler">Annuler</button><button class="bouton plein" data-act="valider">${ico('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.4)}Ajouter à ma liste</button></div>
  </div>`;
  D().appendChild(v);
  v.querySelector('#aRythme').onclick = e => { const b = e.target.closest('button'); if (!b) return; A.rythme = b.dataset.r; v.querySelectorAll('#aRythme button').forEach(x => x.classList.toggle('on', x === b)); };
  const di = v.querySelector('#aDateIn');
  di.onclick = () => { try { di.showPicker(); } catch (e) { } };
  di.onchange = () => { if (!di.value) return; const [y, m, d] = di.value.split('-').map(Number); A.date = new Date(y, m - 1, d); v.querySelector('#aDate').textContent = dateLongue(A.date); };
  v.onclick = e => { if (e.target === v) fermerAjout(); };
  setTimeout(() => (v.querySelector('#aNom') || v.querySelector('#aPrix')).focus({ preventScroll: true }), 50);
}
function fermerAjout() { const v = document.getElementById('voile'); if (v) v.remove(); etat.ajout = null; }
function validerAjout() {
  const A = etat.ajout, v = document.getElementById('voile');
  const prix = lirePrix(v.querySelector('#aPrix').value);
  let nom = A.nom;
  if (A.moi) { nom = v.querySelector('#aNom').value.trim(); if (!nom) { v.querySelector('#aNom').focus(); v.querySelector('#aNom').placeholder = "Écris d'abord son nom"; return; } }
  if (prix === null) { v.querySelector('#aPrix').focus(); return; }
  const a = { id: ++n, logo: A.moi ? 'moi' : A.logo, nom, cat: A.cat, couleur: A.couleur, prix, rythme: A.rythme, date: A.date, auto: true, rappel: true, pause: false, exemple: false };
  ABOS.push(a); fermerAjout();
  etat.vue = 'fiche'; etat.choisi = a.id; etat.confirmeSuppr = false;
  majTout(); rendreDroite(); bulle(`${nom} est dans ta liste`);
  const r = document.querySelector(`.rangee[data-id="${a.id}"]`); if (r) r.scrollIntoView({ block: 'nearest', behavior: doux.matches ? 'auto' : 'smooth' });
}
function bulle(t) {
  document.querySelectorAll('.bulle').forEach(b => b.remove());
  const b = document.createElement('div'); b.className = 'bulle'; b.innerHTML = ico('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.4) + esc(t);
  document.querySelector('.fen').appendChild(b); setTimeout(() => b.remove(), 3200);
}

// ---------- les clics
document.getElementById('liste').onclick = e => {
  const r = e.target.closest('.rangee'); if (!r) return;
  etat.vue = 'fiche'; etat.choisi = +r.dataset.id; etat.confirmeSuppr = false; rendreListe(); rendreDroite();
  if (matchMedia('(max-width: 900px)').matches) D().scrollIntoView({ behavior: doux.matches ? 'auto' : 'smooth' });
};
document.getElementById('btnAjouter').onclick = () => { etat.vue = 'ajouter'; rendreListe(); rendreDroite(); setTimeout(() => { const r = document.getElementById('cRech'); if (r) r.focus({ preventScroll: true }); }, 60); };
D().addEventListener('click', e => {
  const b = e.target.closest('[data-act], .app'); if (!b) return;
  if (b.classList.contains('app')) return ouvrirAjout(b.dataset.i === 'moi' ? 'moi' : +b.dataset.i);
  const a = ABOS.find(x => x.id === etat.choisi), act = b.dataset.act;
  if (act === 'bilan') { etat.vue = 'bilan'; etat.choisi = null; rendreListe(); rendreDroite(); }
  else if (act === 'annuler') fermerAjout();
  else if (act === 'valider') validerAjout();
  else if (act === 'auto' || act === 'rappel') { a[act] = !a[act]; b.classList.toggle('on', a[act]); }
  else if (act === 'pause') { a.pause = !a.pause; majTout(a); rendreActions(a); bulle(a.pause ? `${a.nom} est en pause` : `${a.nom} repart`); }
  else if (act === 'suppr') { etat.confirmeSuppr = true; rendreActions(a); }
  else if (act === 'supprNon') { etat.confirmeSuppr = false; rendreActions(a); }
  else if (act === 'supprOui') { ABOS = ABOS.filter(x => x !== a); etat.confirmeSuppr = false; etat.vue = 'bilan'; etat.choisi = null; majTout(); rendreDroite(); bulle(`${a.nom} est retiré`); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (etat.ajout) fermerAjout(); else if (etat.vue !== 'bilan') { etat.vue = 'bilan'; etat.choisi = null; rendreListe(); rendreDroite(); } } });

// ---------- les liens directs #bilan, #ajouter, #fiche
function depuisAdresse() {
  const h = location.hash.slice(1);
  fermerAjout(); etat.confirmeSuppr = false;
  if (h === 'ajouter') etat.vue = 'ajouter';
  else if (h === 'fiche') { etat.vue = 'fiche'; etat.choisi = ABOS.find(a => a.logo === 'netflix')?.id; }
  else { etat.vue = 'bilan'; etat.choisi = null; }
  rendreListe(); rendreDroite();
}
addEventListener('hashchange', depuisAdresse);
rendreTotal(); depuisAdresse();
// les transitions d'écran seulement après le premier geste (l'écran de départ s'affiche net tout de suite)
const pret = () => document.querySelector('.fen').classList.add('pret');
addEventListener('pointerdown', pret, { once: true }); addEventListener('keydown', pret, { once: true }); addEventListener('hashchange', pret, { once: true });
</script>
