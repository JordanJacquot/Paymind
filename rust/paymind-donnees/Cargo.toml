[package]
name = "paymind-donnees"
version = "0.1.0"
description = "Les données de Paymind (repris de mindcare-donnees) : dossier de données, suite.json, journal, fichiers JSON sûrs, réglages, carte de Mindset (etat.json). Sans écran et sans appel à Windows"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Versions figées (« = ») : une nouvelle version n'entre que par un changement relu.
# Les fichiers JSON (reglages.json, etat.json) : lus avec l'ordre de leurs champs, comme ConvertFrom-Json
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# L'écriture et la lecture sûres des JSON de la suite (json_sur), et les chemins comme .NET : la bibliothèque commune de
# Mindset, à la révision épinglée dans le Cargo.toml de l'espace de travail, sans ses options (ni signature, ni zips,
# ni heure de Windows) ; les fichiers mis de côté prennent l'heure du journal de Paymind.
suite-commun.workspace = true

[lints]
workspace = true
